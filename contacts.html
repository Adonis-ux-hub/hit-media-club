<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon -->
    <link rel="icon" href="images/icons/registration.png">
</head>

<body class="bodyy">

    <!-- Header -->
    <header id="header">

        <div class="brand">
            <a href="index.html">
                <img
                    src="images/icons/logo.png"
                    alt="HIT Media Club Logo"
                    class="site-logo"
                >
            </a>

            <h1 class="h11">
                <span class="txt">H</span>IT
                <span class="txt">M</span>edia
                <span class="txt">C</span>lub
            </h1>
        </div>


        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
            <a href="events.html">Events</a>
            <a href="gallery.html">Gallery</a>
            <a href="contacts.html">Contact Us</a>
            <a href="about.html">About Us</a>
        </nav>


        <!-- Mobile Menu Button -->
        <button
            class="menu-btn"
            onclick="toggleMenu()"
            aria-label="Open navigation menu"
        >
            ☰
        </button>


        <!-- Mobile Dropdown Menu -->
        <nav id="mobileNav" class="mobile-nav">
            <a href="events.html">Events</a>
            <a href="gallery.html">Gallery</a>
            <a href="contacts.html">Contact Us</a>
            <a href="about.html">About Us</a>
        </nav>

    </header>


    <!-- Registration Section -->
    <section class="sect">

        <div class="form-container">

            <h2>Registration Form</h2>

            <form
                action="process.php"
                method="POST"
                id="registrationForm"
            >

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="John Doe"
                        required
                    >

                    <small
                        id="nameError"
                        class="error"
                    ></small>

                </div>


                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Which Department
                    </label>

                    <textarea
                        id="department"
                        name="department"
                        placeholder="Photography, Videography, Graphic Design etc."
                        required
                    ></textarea>

                    <small
                        id="departmentError"
                        class="error"
                    ></small>

                </div>


                <!-- Phone Number -->
                <div class="form-group">

                    <label for="userPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="userPhone"
                        name="userPhone"
                        placeholder="(+263) 712345678"
                        required
                    >

                    <small
                        id="phoneError"
                        class="error"
                    ></small>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="john@example.com"
                        required
                    >

                    <small
                        id="emailError"
                        class="error"
                    ></small>

                </div>


                <!-- Reason to Join -->
                <div class="form-group">

                    <label for="reason">
                        Reason To Join
                    </label>

                    <textarea
                        id="reason"
                        name="reason"
                        rows="5"
                        maxlength="300"
                        placeholder="Why you want to join us?"
                        required
                    ></textarea>

                    <small
                        id="reasonError"
                        class="error"
                    ></small>

                    <div id="characterCount">
                        0 / 300 characters
                    </div>

                </div>


                <!-- Submit Button -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer class="foot">

        <p>Media Club</p>

        <p>
            Create. Capture. Connect.
        </p>

        <p>
            &#169; 2026 Adonis Technologies. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script>
        function toggleMenu() {
            const mobileNav = document.getElementById("mobileNav");
            mobileNav.classList.toggle("active");
        }
    </script>

    <script src="script.js"></script>

</body>

</html>
